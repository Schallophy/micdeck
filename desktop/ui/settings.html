<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicDeck 设置</title>
<style>
  :root{
    --bg:#faf9f5; --panel:#fff; --ink:#1f1e1d; --muted:#6b6862; --line:#e8e4db;
    --accent:#d97757; --accent-ink:#fff;
    --soft:#fbf9f4; --track:#f0ece3; --hover:#f6f3ec;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1b19; --panel:#242320; --ink:#f3efe6; --muted:#a8a196; --line:#3a3733;
      --accent:#e08366; --accent-ink:#1c1b19;
      --soft:#2a2926; --track:#3a3733; --hover:#2e2c29;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       -webkit-user-select:none;user-select:none;
       font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       padding:16px 20px 28px}
  .wrap{max-width:760px;margin:0 auto}
  .top{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  h1{font-size:17px;margin:0;letter-spacing:.2px;font-weight:650}
  .back{font-size:13px;padding:5px 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .row{display:flex;align-items:center;gap:10px;min-height:30px}
  .row + .row{margin-top:10px}
  .label{flex:1 1 auto;min-width:0}
  .hint{color:var(--muted);font-size:12px;margin:9px 0 0}
  .btn{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);
       border-radius:8px;padding:6px 11px;font:13px system-ui,sans-serif;cursor:pointer}
  .btn:hover{background:var(--hover)}
  .btn.armed{border-color:var(--accent);color:var(--accent);background:var(--hover)}
  .btn.hk{font:11.5px var(--mono);letter-spacing:0;text-transform:none;padding:5px 9px;flex:0 0 auto}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
  select{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);
         border-radius:8px;padding:6px 10px;font:13px system-ui,sans-serif;max-width:260px}
  input[type=range]{flex:1 1 auto;accent-color:var(--accent)}
  .val{font:12px var(--mono);color:var(--muted);min-width:56px;text-align:right}
  .off{opacity:.45;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
  <button class="btn ghost back" id="back" title="返回混音台">← 返回</button>
  <h1>设置</h1>
</div>

<section class="card">
  <h2>启动</h2>
  <div class="row">
    <label class="label" for="autostart">登录 Windows 时自动启动</label>
    <input type="checkbox" id="autostart">
  </div>
  <p class="hint">关闭窗口不会退出 MicDeck；开机自启只是省去双击。</p>
</section>

<section class="card">
  <h2>监听</h2>
  <div class="row">
    <label class="label" for="monitorDevice">输出设备</label>
    <select id="monitorDevice"><option value="">选择输出设备…</option></select>
  </div>
  <div class="row">
    <label class="label" for="monitorGain">监听音量</label>
    <input type="range" id="monitorGain" min="-60" max="12" step="0.5">
    <span class="val" id="monitorGainVal">0.0 dB</span>
  </div>
  <p class="hint">监听把线路的混音播到这台设备上，不影响送进虚拟线的声音。在线路卡上用耳机图标开关。</p>
</section>

<section class="card">
  <h2>快捷键</h2>
  <div class="row">
    <span class="label">麦克风开关</span>
    <button class="btn hk" id="hotkeyBtn"></button>
  </div>
  <p class="hint" id="hotkeyHint">点击后按下组合键；Esc 取消，Backspace 清除。左/右 Ctrl、Alt、Shift、Win 可单独作为轻点绑定。</p>
</section>

</div>

<script>
const tauri = window.__TAURI__;
const invoke = (cmd, args) => tauri.core.invoke(cmd, args);
async function getJson(url){ return invoke('api_request', { method:'GET', path:url, body:'' }); }
async function post(url, body){
  try { return await invoke('api_request', { method:'POST', path:url, body: JSON.stringify(body||{}) }); }
  catch (e) { return {}; }
}

// --- start with the session ---------------------------------------------------------------------
// The entry belongs to Windows, not to our store, so the checkbox shows what the registry says after
// every edit rather than what was clicked.
const autostart = document.getElementById('autostart');
async function refreshAutostart(){
  try {
    const r = await getJson('/api/autostart');
    autostart.checked = !!r.enabled;
  } catch (e) {
    autostart.disabled = true;
  }
}
autostart.addEventListener('change', async () => {
  const wanted = autostart.checked;
  autostart.disabled = true;
  try {
    const res = await post('/api/autostart', { enabled: wanted });
    if (res.error) { alert(res.error); autostart.checked = !wanted; return; }
    autostart.checked = !!res.enabled;
  } catch (e) {
    autostart.checked = !wanted;
    alert('没有保存');
  } finally {
    autostart.disabled = false;
  }
});

// --- listening ----------------------------------------------------------------------------------
// The device and the volume are stored settings; whether a line is being listened to is runtime state,
// so this page only ever edits the first two.
const monitorDevice = document.getElementById('monitorDevice');
const monitorGain = document.getElementById('monitorGain');
const monitorGainVal = document.getElementById('monitorGainVal');
const gainToDb = g => (g <= 0 ? -60 : 20 * Math.log10(g));
const dbToGain = db => (db <= -59.5 ? 0 : Math.pow(10, db / 20));
const escapeHtml = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function paintMonitorGain(){
  const db = Number(monitorGain.value);
  monitorGainVal.textContent = (db <= -59.5 ? '−∞' : (db > 0 ? '+' : '') + db.toFixed(1)) + ' dB';
}
async function refreshMonitor(){
  try {
    const devices = await getJson('/api/devices');
    monitorDevice.innerHTML = '<option value="">选择输出设备…</option>' +
      (devices.outputs || []).map(o => `<option value="${escapeHtml(o.id)}">${escapeHtml(o.name)}</option>`).join('');
    const config = await getJson('/api/monitor');
    if (config.deviceId) monitorDevice.value = config.deviceId;
    const db = Math.max(-60, Math.min(12, gainToDb(config.gain || 0)));
    monitorGain.value = String(db);
    paintMonitorGain();
  } catch (e) {}
}
monitorDevice.addEventListener('change', async () => {
  const deviceId = monitorDevice.value;
  if (!deviceId) return;
  monitorDevice.disabled = true;
  try {
    const res = await post('/api/monitor/output', { deviceId });
    if (res.error) alert(res.error);
  } finally {
    monitorDevice.disabled = false;
  }
});
monitorGain.addEventListener('input', paintMonitorGain);
let monitorGainTimer = null;
monitorGain.addEventListener('input', () => {
  clearTimeout(monitorGainTimer);
  // Captured at event time: the label may have moved on, the value that was dragged to is what counts.
  const gain = dbToGain(Number(monitorGain.value));
  monitorGainTimer = setTimeout(() => { post('/api/monitor/gain', { gain }); }, 150);
});

// --- shortcut recorder --------------------------------------------------------------------------
// Physical keys, not characters: Shift must not turn the recorded chord into a symbol, and a Chinese
// IME must not sit between the user and the key they pressed.
function keyName(code){
  let m;
  if ((m = /^Key([A-Z])$/.exec(code))) return m[1];
  if ((m = /^Digit([0-9])$/.exec(code))) return m[1];
  if ((m = /^F([1-9]|1[0-9]|2[0-4])$/.exec(code))) return 'F' + m[1];
  return {
    ArrowUp:'Up', ArrowDown:'Down', ArrowLeft:'Left', ArrowRight:'Right',
    Space:'Space', Enter:'Enter', Tab:'Tab', Backspace:'Backspace',
    Insert:'Insert', Delete:'Delete', Home:'Home', End:'End',
    PageUp:'PageUp', PageDown:'PageDown', Pause:'Pause',
    ScrollLock:'ScrollLock', PrintScreen:'PrintScreen'
  }[code] || null;
}
function chordOf(e){
  const mods = [];
  if (e.ctrlKey) mods.push('Ctrl');
  if (e.altKey) mods.push('Alt');
  if (e.shiftKey) mods.push('Shift');
  if (e.metaKey) mods.push('Win');
  const key = keyName(e.code);
  return key ? mods.concat(key).join('+') : null;
}
let current = '';
let armed = false;
function paint(text){
  current = text || '';
  const btn = document.getElementById('hotkeyBtn');
  btn.textContent = current || '设置快捷键';
  btn.title = current ? `麦克风开关快捷键：${current}（点击修改）` : '未设置麦克风开关快捷键（点击设置）';
}
function disarm(){
  if (!armed) return;
  armed = false;
  tapCandidate = null;
  document.getElementById('hotkeyBtn').classList.remove('armed');
  paint(current);
}
async function refresh(){
  try {
    const r = await getJson('/api/hotkey');
    if (!armed) paint(r.hotkey);
  } catch (e) {}
}
async function save(chord){
  armed = false;
  document.getElementById('hotkeyBtn').classList.remove('armed');
  try {
    const res = await post('/api/hotkey', { hotkey: chord });
    if (res.error) { alert(res.error); paint(current); return; }
    paint(res.hotkey);
  } catch (e) {
    alert('快捷键没有保存');
    paint(current);
  }
}
const hotkeyBtn = document.getElementById('hotkeyBtn');
hotkeyBtn.addEventListener('click', () => {
  armed = true;
  hotkeyBtn.classList.add('armed');
  hotkeyBtn.textContent = '请按快捷键…';
  hotkeyBtn.title = '按 Esc 取消；Backspace 清除；左右 Ctrl/Alt/Shift/Win 单独按下再松开也可以';
});
hotkeyBtn.addEventListener('blur', disarm);

// Side-specific modifiers are recorded on release, matching how the tray judges a tap: only if no
// other key joined in between does the press count as the shortcut and not as a chord's first key.
const MODIFIER_NAMES = {
  ControlLeft:'LCtrl', ControlRight:'RCtrl', AltLeft:'LAlt', AltRight:'RAlt',
  ShiftLeft:'LShift', ShiftRight:'RShift', MetaLeft:'LWin', MetaRight:'RWin'
};
let tapCandidate = null;
window.addEventListener('keydown', e => {
  if (!armed || e.isComposing) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.key === 'Escape') { disarm(); return; }
  // A bare Backspace clears the shortcut; with a modifier it is a key like any other.
  if (e.code === 'Backspace' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) {
    tapCandidate = null;
    save('');
    return;
  }
  if (MODIFIER_NAMES[e.code]) {
    const held = e.ctrlKey + e.altKey + e.shiftKey + e.metaKey;
    tapCandidate = (tapCandidate === null && held === 1) ? e.code : null;
    return;
  }
  tapCandidate = null;
  const chord = chordOf(e);
  if (chord) save(chord);
}, true);
window.addEventListener('keyup', e => {
  if (tapCandidate && e.code === tapCandidate) {
    const label = MODIFIER_NAMES[e.code];
    tapCandidate = null;
    if (armed && label) save(label);
  }
}, true);

document.getElementById('back').addEventListener('click', () => { location.href = 'index.html'; });

refresh();
refreshAutostart();
refreshMonitor();
</script>
</body>
</html>
