<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicDeck 设置</title>
<style>
  :root{
    --bg:#faf9f5; --panel:#fff; --ink:#1f1e1d; --muted:#6b6862; --line:#e8e4db;
    --accent:#d97757; --accent-ink:#fff;
    --soft:#fbf9f4; --track:#f0ece3; --hover:#f6f3ec;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1b19; --panel:#242320; --ink:#f3efe6; --muted:#a8a196; --line:#3a3733;
      --accent:#e08366; --accent-ink:#1c1b19;
      --soft:#2a2926; --track:#3a3733; --hover:#2e2c29;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       -webkit-user-select:none;user-select:none;
       font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       padding:18px 20px 28px}
  h1{font-size:17px;margin:0 0 14px;letter-spacing:.2px;font-weight:650}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .row{display:flex;align-items:center;gap:10px;min-height:30px}
  .row + .row{margin-top:10px}
  .label{flex:1 1 auto;min-width:0}
  .hint{color:var(--muted);font-size:12px;margin:9px 0 0}
  .btn{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);
       border-radius:8px;padding:6px 11px;font:13px system-ui,sans-serif;cursor:pointer}
  .btn:hover{background:var(--hover)}
  .btn.armed{border-color:var(--accent);color:var(--accent);background:var(--hover)}
  .btn.hk{font:11.5px var(--mono);letter-spacing:0;text-transform:none;padding:5px 9px;flex:0 0 auto}
  select{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);
         border-radius:8px;padding:6px 10px;font:13px system-ui,sans-serif;max-width:260px}
  input[type=range]{flex:1 1 auto;accent-color:var(--accent)}
  .val{font:12px var(--mono);color:var(--muted);min-width:56px;text-align:right}
  .off{opacity:.45;pointer-events:none}
</style>
</head>
<body>
<h1>设置</h1>

<section class="card">
  <h2>快捷键</h2>
  <div class="row">
    <span class="label">麦克风开关</span>
    <button class="btn hk" id="hotkeyBtn"></button>
  </div>
  <p class="hint" id="hotkeyHint">点击后按下组合键；Esc 取消，Backspace 清除。左/右 Ctrl、Alt、Shift、Win 可单独作为轻点绑定。</p>
</section>

<script>
const tauri = window.__TAURI__;
const invoke = (cmd, args) => tauri.core.invoke(cmd, args);
async function getJson(url){ return invoke('api_request', { method:'GET', path:url, body:'' }); }
async function post(url, body){
  try { return await invoke('api_request', { method:'POST', path:url, body: JSON.stringify(body||{}) }); }
  catch (e) { return {}; }
}

// --- shortcut recorder --------------------------------------------------------------------------
// Physical keys, not characters: Shift must not turn the recorded chord into a symbol, and a Chinese
// IME must not sit between the user and the key they pressed.
function keyName(code){
  let m;
  if ((m = /^Key([A-Z])$/.exec(code))) return m[1];
  if ((m = /^Digit([0-9])$/.exec(code))) return m[1];
  if ((m = /^F([1-9]|1[0-9]|2[0-4])$/.exec(code))) return 'F' + m[1];
  return {
    ArrowUp:'Up', ArrowDown:'Down', ArrowLeft:'Left', ArrowRight:'Right',
    Space:'Space', Enter:'Enter', Tab:'Tab', Backspace:'Backspace',
    Insert:'Insert', Delete:'Delete', Home:'Home', End:'End',
    PageUp:'PageUp', PageDown:'PageDown', Pause:'Pause',
    ScrollLock:'ScrollLock', PrintScreen:'PrintScreen'
  }[code] || null;
}
function chordOf(e){
  const mods = [];
  if (e.ctrlKey) mods.push('Ctrl');
  if (e.altKey) mods.push('Alt');
  if (e.shiftKey) mods.push('Shift');
  if (e.metaKey) mods.push('Win');
  const key = keyName(e.code);
  return key ? mods.concat(key).join('+') : null;
}
let current = '';
let armed = false;
function paint(text){
  current = text || '';
  const btn = document.getElementById('hotkeyBtn');
  btn.textContent = current || '设置快捷键';
  btn.title = current ? `麦克风开关快捷键：${current}（点击修改）` : '未设置麦克风开关快捷键（点击设置）';
}
function disarm(){
  if (!armed) return;
  armed = false;
  tapCandidate = null;
  document.getElementById('hotkeyBtn').classList.remove('armed');
  paint(current);
}
async function refresh(){
  try {
    const r = await getJson('/api/hotkey');
    if (!armed) paint(r.hotkey);
  } catch (e) {}
}
async function save(chord){
  armed = false;
  document.getElementById('hotkeyBtn').classList.remove('armed');
  try {
    const res = await post('/api/hotkey', { hotkey: chord });
    if (res.error) { alert(res.error); paint(current); return; }
    paint(res.hotkey);
  } catch (e) {
    alert('快捷键没有保存');
    paint(current);
  }
}
const hotkeyBtn = document.getElementById('hotkeyBtn');
hotkeyBtn.addEventListener('click', () => {
  armed = true;
  hotkeyBtn.classList.add('armed');
  hotkeyBtn.textContent = '请按快捷键…';
  hotkeyBtn.title = '按 Esc 取消；Backspace 清除；左右 Ctrl/Alt/Shift/Win 单独按下再松开也可以';
});
hotkeyBtn.addEventListener('blur', disarm);

// Side-specific modifiers are recorded on release, matching how the tray judges a tap: only if no
// other key joined in between does the press count as the shortcut and not as a chord's first key.
const MODIFIER_NAMES = {
  ControlLeft:'LCtrl', ControlRight:'RCtrl', AltLeft:'LAlt', AltRight:'RAlt',
  ShiftLeft:'LShift', ShiftRight:'RShift', MetaLeft:'LWin', MetaRight:'RWin'
};
let tapCandidate = null;
window.addEventListener('keydown', e => {
  if (!armed || e.isComposing) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.key === 'Escape') { disarm(); return; }
  // A bare Backspace clears the shortcut; with a modifier it is a key like any other.
  if (e.code === 'Backspace' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) {
    tapCandidate = null;
    save('');
    return;
  }
  if (MODIFIER_NAMES[e.code]) {
    const held = e.ctrlKey + e.altKey + e.shiftKey + e.metaKey;
    tapCandidate = (tapCandidate === null && held === 1) ? e.code : null;
    return;
  }
  tapCandidate = null;
  const chord = chordOf(e);
  if (chord) save(chord);
}, true);
window.addEventListener('keyup', e => {
  if (tapCandidate && e.code === tapCandidate) {
    const label = MODIFIER_NAMES[e.code];
    tapCandidate = null;
    if (armed && label) save(label);
  }
}, true);

refresh();
</script>
</body>
</html>
