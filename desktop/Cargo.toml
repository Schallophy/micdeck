[package]
name = "micdeck-desktop"
version = "0.1.0"
edition = "2021"
description = "MicDeck's desktop shell: the tray, the window and the commands behind it"
license = "MIT"

[dependencies]
micdeck_lib = { package = "micdeck", path = ".." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
